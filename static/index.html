<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#4f6bed">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #333;
        }
        .container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .auth-screen {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4f6bed 0%, #667ff9 100%);
        }
        .auth-form {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 350px;
        }
        .auth-form h1 {
            margin-bottom: 30px;
            text-align: center;
            color: #4f6bed;
            font-size: 28px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .auth-form input:focus {
            outline: none;
            border-color: #4f6bed;
            box-shadow: 0 0 0 3px rgba(79, 107, 237, 0.1);
        }
        .auth-form button {
            width: 100%;
            padding: 12px;
            background: #4f6bed;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
        }
        .auth-form button:hover { background: #3e52b8; }
        .toggle-auth {
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        .toggle-auth a {
            color: #4f6bed;
            text-decoration: none;
            cursor: pointer;
        }
        .toggle-auth a:hover { text-decoration: underline; }

        .chat-screen { display: none; }
        .chat-screen.active {
            display: flex;
            width: 100%;
            height: 100vh;
            height: 100dvh;
        }
        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info .username {
            font-weight: 600;
            color: #333;
        }
        .user-info button {
            padding: 6px 12px;
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .user-info button:hover { background: #e0e0e0; }

        .new-room-form {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 5px;
        }
        .new-room-form input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
        }
        .new-room-form button {
            padding: 8px 12px;
            background: #4f6bed;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .sidebar-section {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .sidebar-section h3 {
            font-size: 12px;
            font-weight: 600;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .sidebar-list {
            max-height: 200px;
            overflow-y: auto;
        }
        .sidebar-item {
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }
        .sidebar-item:hover { background: #f5f5f5; }
        .sidebar-item.active {
            background: #4f6bed;
            color: white;
        }

        .chat-area {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #fff;
        }
        .chat-header {
            padding: 15px;
            background: white;
            border-bottom: 1px solid #ddd;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .back-btn {
            display: none;
            background: #f0f0f0;
            border: none;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
        }
        .messages {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.own {
            align-items: flex-end;
        }
        .message.own .bubble {
            background: #4f6bed;
            color: white;
        }
        .message.other .bubble {
            background: #f0f0f0;
            color: #333;
        }
        .message-sender {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .bubble {
            padding: 10px 15px;
            border-radius: 12px;
            max-width: 60%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .timestamp {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }

        .input-area {
            padding: 15px;
            border-top: 1px solid #ddd;
            background: white;
        }
        .input-form {
            display: flex;
            gap: 10px;
        }
        .input-form input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        .input-form input:focus {
            outline: none;
            border-color: #4f6bed;
        }
        .input-form button {
            padding: 12px 20px;
            background: #4f6bed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .input-form button:hover { background: #3e52b8; }

        /* Phone layout: show either the list or the chat */
        @media (max-width: 700px) {
            .sidebar { width: 100%; border-right: none; }
            .chat-area { width: 100%; }
            .chat-screen .chat-area { display: none; }
            .chat-screen.in-chat .chat-area { display: flex; }
            .chat-screen.in-chat .sidebar { display: none; }
            .back-btn { display: inline-block; }
            .bubble { max-width: 80%; }
        }

        .error { color: #d32f2f; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="auth-screen" id="authScreen">
        <div class="auth-form">
            <h1>💬 Chat</h1>

            <div id="loginForm">
                <h2 style="font-size: 18px; margin-bottom: 20px; color: #333;">Log In</h2>
                <input type="text" id="loginUsername" placeholder="Username" autocomplete="username">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <button onclick="login()">Log In</button>
                <div class="error" id="loginError"></div>
                <div class="toggle-auth">
                    Don't have account? <a onclick="toggleAuth()">Sign up</a>
                </div>
            </div>

            <div id="signupForm" style="display: none;">
                <h2 style="font-size: 18px; margin-bottom: 20px; color: #333;">Sign Up</h2>
                <input type="text" id="signupUsername" placeholder="Username (3-20 chars)" autocomplete="username">
                <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" autocomplete="new-password">
                <button onclick="signup()">Sign Up</button>
                <div class="error" id="signupError"></div>
                <div class="toggle-auth">
                    Already have account? <a onclick="toggleAuth()">Log in</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat Screen -->
    <div class="chat-screen" id="chatScreen">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="user-info">
                    <div class="username" id="currentUser"></div>
                    <button onclick="logout()">Logout</button>
                </div>
            </div>

            <div class="new-room-form">
                <input type="text" id="newRoomName" placeholder="Room name">
                <button onclick="createRoom()">+</button>
            </div>

            <div class="sidebar-section">
                <h3>Rooms</h3>
                <div class="sidebar-list" id="roomsList"></div>
            </div>

            <div class="sidebar-section">
                <h3>Users</h3>
                <div class="sidebar-list" id="usersList"></div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <button class="back-btn" onclick="goBack()">&larr; Back</button>
                <span id="chatHeader">Select a chat</span>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-form">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===== STATE =====
        let token = sessionStorage.getItem('token');
        let username = sessionStorage.getItem('username');
        let currentRoom = null;
        let currentDM = null;
        let ws = null;
        let onlineUsers = new Set();

        // ===== INIT =====
        if (token && username) {
            showChatScreen();
        }

        // ===== AUTH =====
        function toggleAuth() {
            document.getElementById('loginForm').style.display =
                document.getElementById('loginForm').style.display === 'none' ? 'block' : 'none';
            document.getElementById('signupForm').style.display =
                document.getElementById('signupForm').style.display === 'none' ? 'block' : 'none';
            clearErrors();
        }

        function clearErrors() {
            document.getElementById('loginError').textContent = '';
            document.getElementById('signupError').textContent = '';
        }

        async function login() {
            const user = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value;
            if (!user || !pass) {
                document.getElementById('loginError').textContent = 'Fill all fields';
                return;
            }
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                if (!res.ok) throw new Error('Invalid credentials');
                const data = await res.json();
                sessionStorage.setItem('token', data.token);
                sessionStorage.setItem('username', data.username);
                token = data.token;
                username = data.username;
                showChatScreen();
            } catch (e) {
                document.getElementById('loginError').textContent = e.message;
            }
        }

        async function signup() {
            const user = document.getElementById('signupUsername').value.trim();
            const pass = document.getElementById('signupPassword').value;
            if (!user || !pass) {
                document.getElementById('signupError').textContent = 'Fill all fields';
                return;
            }
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                if (!res.ok) throw new Error('Username taken or invalid');
                const data = await res.json();
                sessionStorage.setItem('token', data.token);
                sessionStorage.setItem('username', data.username);
                token = data.token;
                username = data.username;
                showChatScreen();
            } catch (e) {
                document.getElementById('signupError').textContent = e.message;
            }
        }

        function logout() {
            sessionStorage.clear();
            if (ws) ws.close();
            location.reload();
        }

        // ===== UI SWITCH =====
        function showChatScreen() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatScreen').classList.add('active');
            document.getElementById('currentUser').textContent = username;
            connectWebSocket();
            loadRooms();
            loadUsers();
        }

        // ===== DATA =====
        async function loadRooms() {
            try {
                const res = await fetch('/api/rooms', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const rooms = await res.json();
                const list = document.getElementById('roomsList');
                list.innerHTML = rooms.map(r =>
                    `<div class="sidebar-item" onclick="selectRoom('${r}')">${r}</div>`
                ).join('');
            } catch (e) {
                console.error('Load rooms:', e);
            }
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/users', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const users = await res.json();
                const list = document.getElementById('usersList');
                list.innerHTML = users.map(u =>
                    `<div class="sidebar-item" onclick="selectUser('${u}')">${u} <span id="status-${u}" style="font-size:10px;"></span></div>`
                ).join('');
            } catch (e) {
                console.error('Load users:', e);
            }
        }

        async function createRoom() {
            const name = document.getElementById('newRoomName').value.trim().toLowerCase();
            if (!name) return;
            try {
                const res = await fetch('/api/rooms', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (res.ok) {
                    document.getElementById('newRoomName').value = '';
                    loadRooms();
                }
            } catch (e) {
                console.error('Create room:', e);
            }
        }

        // ===== CHAT SELECTION =====
        function selectRoom(room) {
            currentRoom = room;
            currentDM = null;
            document.getElementById('chatScreen').classList.add('in-chat');
            updateActive();
            loadHistory();
        }

        function selectUser(user) {
            currentRoom = null;
            currentDM = user;
            document.getElementById('chatScreen').classList.add('in-chat');
            updateActive();
            loadHistory();
        }

        function goBack() {
            document.getElementById('chatScreen').classList.remove('in-chat');
        }

        function updateActive() {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            if (currentRoom) {
                document.querySelectorAll('.sidebar-item').forEach(el => {
                    if (el.textContent.includes(currentRoom)) el.classList.add('active');
                });
                document.getElementById('chatHeader').textContent = '#' + currentRoom;
            } else if (currentDM) {
                document.querySelectorAll('.sidebar-item').forEach(el => {
                    if (el.textContent.includes(currentDM)) el.classList.add('active');
                });
                document.getElementById('chatHeader').textContent = '@' + currentDM;
            }
        }

        async function loadHistory() {
            if (!currentRoom && !currentDM) return;
            try {
                const url = currentRoom
                    ? `/api/history?room=${currentRoom}`
                    : `/api/history?with=${currentDM}`;
                const res = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const msgs = await res.json();
                displayMessages(msgs);
            } catch (e) {
                console.error('Load history:', e);
            }
        }

        // ===== MESSAGES =====
        function messageHTML(m) {
            const isOwn = m.sender === username;
            const time = new Date(m.ts * 1000).toLocaleTimeString();
            return `
                <div class="message ${isOwn ? 'own' : 'other'}">
                    <div class="message-sender">${escapeHtml(m.sender)}</div>
                    <div class="bubble">${escapeHtml(m.content)}</div>
                    <div class="timestamp">${time}</div>
                </div>
            `;
        }

        function displayMessages(msgs) {
            const container = document.getElementById('messages');
            container.innerHTML = msgs.map(messageHTML).join('');
            container.scrollTop = container.scrollHeight;
        }

        function appendMessage(m) {
            const container = document.getElementById('messages');
            container.insertAdjacentHTML('beforeend', messageHTML(m));
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content || !ws || ws.readyState !== 1) return;

            if (currentRoom) {
                ws.send(JSON.stringify({ type: 'room', room: currentRoom, content }));
            } else if (currentDM) {
                ws.send(JSON.stringify({ type: 'dm', to: currentDM, content }));
            }
            input.value = '';
        }

        // ===== WEBSOCKET =====
        function connectWebSocket() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws?token=${token}`);

            ws.onopen = () => {
                console.log('Connected');
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'presence') {
                    onlineUsers = new Set(msg.online);
                    // refresh the list so newly signed-up friends appear
                    loadUsers().then(() => { updateActive(); updateOnlineStatus(); });
                } else if (msg.type === 'message') {
                    if ((msg.kind === 'room' && msg.room === currentRoom) ||
                        (msg.kind === 'dm' && ((msg.sender === currentDM && msg.recipient === username) ||
                                               (msg.sender === username && msg.recipient === currentDM)))) {
                        appendMessage(msg);
                    }
                }
            };

            ws.onerror = (e) => console.error('WS error:', e);
            ws.onclose = () => setTimeout(connectWebSocket, 3000);
        }

        function updateOnlineStatus() {
            document.querySelectorAll('#usersList .sidebar-item').forEach(el => {
                const status = el.querySelector('[id^="status-"]');
                if (status) {
                    const user = status.id.replace('status-', '');
                    status.textContent = onlineUsers.has(user) ? '🟢' : '';
                }
            });
        }

        // ===== ENTER TO SEND =====
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('messageInput')?.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/static/service-worker.js');
            }
        });
    </script>
</body>
</html>
